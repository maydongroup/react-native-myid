buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0")
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// ---------------------------------------------------------------------------
// New Architecture support
// ---------------------------------------------------------------------------

def isNewArchEnabled = rootProject.hasProperty("newArchEnabled") &&
    rootProject.getProperty("newArchEnabled") == "true"

if (isNewArchEnabled) {
    apply plugin: "com.facebook.react"
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.reactnativemyid"
    compileSdkVersion safeExtGet("compileSdkVersion", 34)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 21)
        targetSdkVersion safeExtGet("targetSdkVersion", 34)

        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "${isNewArchEnabled}"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            java.srcDirs = ["src/main/java"]
            if (isNewArchEnabled) {
                java.srcDirs += ["src/newarch"]
            } else {
                java.srcDirs += ["src/oldarch"]
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://artifactory.aigroup.uz:443/artifactory/myid/" }
}

dependencies {
    // React Native
    implementation "com.facebook.react:react-android:+"

    // MyID SDK (from Artifactory)
    debugImplementation "uz.myid.sdk.capture:myid-capture-sdk-debug:3.1.5"
    releaseImplementation "uz.myid.sdk.capture:myid-capture-sdk:3.1.5"

    // MyID Video Capture SDK (required for VideoIdentification entry type)
    implementation "uz.myid.sdk.capture:myid-video-capture-sdk:3.1.5"
}
